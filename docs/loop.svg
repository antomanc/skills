<svg xmlns="http://www.w3.org/2000/svg" width="860" height="275" viewBox="0 0 860 275" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="275" rx="14" fill="#f8fafc"/>
  <text x="30" y="38" font-size="18" font-weight="600" fill="#0f172a">One loop, run again and again on the same repo</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <g font-size="14">
    <rect x="30" y="70" width="170" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="115" y="98" text-anchor="middle" font-weight="600" fill="#0c4a6e">1. Look</text>
    <text x="115" y="124" text-anchor="middle" fill="#0f172a">count the risky spots,</text>
    <text x="115" y="144" text-anchor="middle" fill="#0f172a">read the code and tests,</text>
    <text x="115" y="164" text-anchor="middle" fill="#0f172a">find repeated fixes</text>
    <rect x="240" y="70" width="170" height="110" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="325" y="98" text-anchor="middle" font-weight="600" fill="#713f12">2. Plan</text>
    <text x="325" y="124" text-anchor="middle" fill="#0f172a">at most 7 items,</text>
    <text x="325" y="144" text-anchor="middle" fill="#0f172a">each with proof from</text>
    <text x="325" y="164" text-anchor="middle" fill="#0f172a">the repo. You say yes.</text>
    <rect x="450" y="70" width="170" height="110" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="535" y="98" text-anchor="middle" font-weight="600" fill="#14532d">3. Apply</text>
    <text x="535" y="124" text-anchor="middle" fill="#0f172a">an alternative, then</text>
    <text x="535" y="144" text-anchor="middle" fill="#0f172a">a check that fails the</text>
    <text x="535" y="164" text-anchor="middle" fill="#0f172a">build, tried once</text>
    <rect x="660" y="70" width="170" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="745" y="98" text-anchor="middle" font-weight="600" fill="#3b0764">4. Re-run later</text>
    <text x="745" y="124" text-anchor="middle" fill="#0f172a">do the checks still run?</text>
    <text x="745" y="144" text-anchor="middle" fill="#0f172a">any new repeated fixes?</text>
    <text x="745" y="164" text-anchor="middle" fill="#0f172a">new prose rules?</text>
    <line x1="200" y1="125" x2="238" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <line x1="410" y1="125" x2="448" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <line x1="620" y1="125" x2="658" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <path d="M745,180 C745,228 115,228 115,182" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <text x="430" y="258" text-anchor="middle" fill="#475569" font-size="13">nothing changed? it says so in one line and touches no file</text>
  </g>
</svg>
