version: "2"
linters:
  enable:
    - errcheck
    - errchkjson
    - forbidigo
    - govet
    - staticcheck
    - unused
    - nolintlint
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          msg: take a clock.Clock so tests can fix the time
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: internal/clock/
        linters: [forbidigo]
